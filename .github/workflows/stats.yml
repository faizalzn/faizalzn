name: Update Stats

on:
  schedule:
    - cron: "17 2 * * *"   # setiap hari, 02:17 UTC
  workflow_dispatch:         # bisa dijalankan manual dari tab Actions
  push:
    paths:
      - "scripts/generate_stats.py"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buat kartu statistik
        env:
          # Opsional: buat secret STATS_TOKEN (PAT dengan scope read:user) agar kontribusi privat ikut dihitung.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/generate_stats.py

      - name: Commit jika ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet || (git commit -m "chore: update stats" && git push)
